<!DOCTYPE html>
<html lang="en">

<head>
  <title>T10-input from HTML</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- stylesheets *******************************************-->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" type="image/png" href="../assets/dtec_favicon.png">
</head>

<!--*************************************************************
  BODY
**************************************************************-->

<body>
  <h1>T10-input from HTML</h1>
  <p>Open the console <code>(Ctrl-shift-i)</code> to see the messages.</p>

  <p><br><br><i>Copy your HTML from the last task and keep building.</i><br><br><br><br></p>


  <div id="spaceForJavaScriptOutput">
    Please enter your age and pocket money, then submit the form.
  </div>

  <form id="userForm">
    <label for="nameField">Name:</label>
    <input type="text" id="nameField" placeholder="Your name">

    <label for="ageField">Age:</label>
    <input type="number" id="ageField" placeholder="Your age" min="0">

    <label for="moneyField">Pocket money:</label>
    <input type="number" id="moneyField" placeholder="Pocket money" min="0" step="0.01">

    <button type="submit">Submit</button>
  </form>

  <script src="../t10_input_from_HTML.js"></script>

</body>

</html>
<!--*************************************************************
  END OF T10_INPUT_FROM_HTML.HTML
**************************************************************-->
